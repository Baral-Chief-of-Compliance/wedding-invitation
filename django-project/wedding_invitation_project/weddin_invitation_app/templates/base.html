{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <!-- Шрифт Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet">
    
    <!-- Фавикон -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">

    <!-- Яндекс карты -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=d3fcbd49-8bb4-4daa-b0d5-3a92837a126f&lang=ru_RU" type="text/javascript">
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #f8f2ff 50%, #f0f9ff 100%);
            min-height: 100vh;
            color: #5a4a4a;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Анимация падающих элементов */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .floating-element {
            position: absolute;
            font-size: 24px;
            opacity: 0.15;
            animation-name: floating;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        
        @keyframes floating {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.15;
            }
            90% {
                opacity: 0.15;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Основной контейнер */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Декоративные элементы */
        .decoration-left,
        .decoration-right {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 120px;
            opacity: 0.1;
            z-index: -1;
        }
        
        .decoration-left {
            left: 20px;
            animation: sway-left 8s ease-in-out infinite;
        }
        
        .decoration-right {
            right: 20px;
            animation: sway-right 8s ease-in-out infinite;
        }
        
        @keyframes sway-left {
            0%, 100% { transform: translateY(-50%) rotate(-10deg); }
            50% { transform: translateY(-50%) rotate(10deg); }
        }
        
        @keyframes sway-right {
            0%, 100% { transform: translateY(-50%) rotate(10deg); }
            50% { transform: translateY(-50%) rotate(-10deg); }
        }
        
        /* Стили для контента */
        .content-wrapper {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 20px;
        }
        
        /* Свадебная тематика */
        .wedding-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px dashed #ffb6c1;
            position: relative;
        }
        
        .wedding-header::before,
        .wedding-header::after {
            content: "💍";
            position: absolute;
            bottom: -15px;
            font-size: 20px;
            background: white;
            padding: 0 10px;
        }
        
        .wedding-header::before {
            left: calc(50% - 60px);
        }
        
        .wedding-header::after {
            right: calc(50% - 60px);
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .content-wrapper {
                padding: 20px;
                border-radius: 16px;
            }
            
            .decoration-left,
            .decoration-right {
                display: none;
            }
            
            .wedding-header {
                margin-bottom: 30px;
                padding-bottom: 20px;
            }
        }
        
        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 182, 193, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #ffb6c1, #d8bfd8);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #ff9eb3, #c9a0dc);
        }
    </style>
    
    {% block head %}
    {% endblock %}
    
    <title>{% block title %}Свадебное приглашение{% endblock %}</title>
</head>

<body>
    <!-- Падающие элементы -->
    <div class="floating-elements" id="floatingElements"></div>
    
    <!-- Декоративные элементы по бокам -->
    <div class="decoration-left">💖</div>
    <div class="decoration-right">💕</div>
    
    <div class="container">
        <div class="content-wrapper">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <script>
        // Создание падающих элементов
        document.addEventListener('DOMContentLoaded', function() {
            const floatingElements = document.getElementById('floatingElements');
            const emojis = ['💍', '💖', '💕', '💑', '👰', '🤵', '💐', '🌸', '💒', '🥂', '🎀', '✨'];
            
            for (let i = 0; i < 15; i++) {
                const element = document.createElement('div');
                element.className = 'floating-element';
                element.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Случайная позиция
                const left = Math.random() * 100;
                element.style.left = left + '%';
                
                // Случайная задержка и продолжительность анимации
                const delay = Math.random() * 5;
                const duration = 10 + Math.random() * 10;
                element.style.animationDelay = delay + 's';
                element.style.animationDuration = duration + 's';
                
                // Случайный размер
                const size = 16 + Math.random() * 32;
                element.style.fontSize = size + 'px';
                
                floatingElements.appendChild(element);
            }
            
            // Плавное появление контента
            const contentWrapper = document.querySelector('.content-wrapper');
            if (contentWrapper) {
                contentWrapper.style.opacity = '0';
                contentWrapper.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    contentWrapper.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                    contentWrapper.style.opacity = '1';
                    contentWrapper.style.transform = 'translateY(0)';
                }, 300);
            }
        });
    </script>
    
    {% block scripts %}
    {% endblock %}
</body>
</html>
